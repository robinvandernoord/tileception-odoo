[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[project]
name = "tileception-odoo"
version = "0.1.0"
description = "Private, local Odoo task and project search for Tileception"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0,<3",
    "onnxruntime>=1.22,<2",
    "tokenizers>=0.21,<1",
    "rapidfuzz>=3.10,<4",
]

[project.scripts]
tileception-odoo = "tileception_odoo.cli:main"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md"]

[project.optional-dependencies]
dev = ["ruff>=0.11", "vommit>=0.10,<1"]

[tool.vommit]
version_source = "pyproject.toml"
allow_breaking_bang = true
allow_breaking_footer = true
prerelease_token = "rc"
confirm = true
ignore = []

[tool.vommit.git]
enabled = true
origin = "origin"
branch = "master"
on_wrong_branch = "error"
tag_format = "v{version}"
commit_format = "chore(release): {version}"

[tool.vommit.changelog]
enabled = true
file = "CHANGELOG.md"
include_prereleases = false
placeholder = "<!-- next-version-placeholder -->"
placeholder_regex = "^<!\\-\\-[ \\t]+next\\-version\\-placeholder[ \\t]+\\-\\->$"
entry_title_format = "## v{version} ({date:%Y-%m-%d})"

[tool.vommit.changelog.levels]
break = "Breaking Change{s}"
feat = "Feature{s}"
fix = "Fix{es}"
perf = "Performance"
docs = "Documentation"

[tool.vommit.pypi]
enabled = false

[tool.vommit.commands]
clean = "rm -rf ./dist"
build = "uv build"
publish = ""
post_publish = ""

[tool.vommit.version_bump_map]
break = "major"
feat = "minor"
fix = "patch"
perf = "patch"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
